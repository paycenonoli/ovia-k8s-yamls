apiVersion: v1
kind: Pod
metadata:
  name: ovia-nodejs
  labels:
    app: ovia-node
  namespace: ovia
spec:
  containers:
  - name: ovia-nodejs
    image: ojpascale/ovia-nodejs:v1
    ports:
    - containerPort: 9981

---
apiVersion: v1
kind: Service
metadata: 
  name: node-svc
  namespace: ovia

spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 9981
  selector:
    app: ovia-node






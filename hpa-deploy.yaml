---
apiVersion: v1
kind: Namespace
metadata:
  name: ovia

---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: hpa-deploy
  namespace: ovia
spec:
  replicas: 2
  selector:
    matchLabels:
      name: hpa-pods
  template:
    metadata:
      namespace: ovia
      labels: 
        name: hpa-pods
    spec:
      containers:
      - name: hpa-container
        image: ojpascale/ovia-maven-web:v1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 400Mi
          limits:
            cpu: 1
            memory: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ovia-svc
  namespace: ovia
spec:
  selector:
    name: hpa-pods
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080






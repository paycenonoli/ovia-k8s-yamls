apiVersion: apps/v1
kind: Deployment 
metadata:
  name: ovia-deployment
  namespace: ovia-ns
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ovia-app
  template:
    metadata:
      labels: 
        app: ovia-app
    spec:
      containers:
      - name: ovia-container
        image: ojpascale/ovia-maven-web:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ovia-svc
  namespace: ovia-ns
spec:
  selector:
    app: ovia-app
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
